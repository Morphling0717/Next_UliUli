services:
  website:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://uliuli.cn}
    container_name: uliuli-website
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      MAIL_AUTH_PASSWORD: ${MAIL_AUTH_PASSWORD:-}
      DEV_UNLOCK_PASSWORD: ${DEV_UNLOCK_PASSWORD:?set DEV_UNLOCK_PASSWORD in .env}
      DATABASE_PATH: /app/data/codes.db
      DB_BACKUP_RETENTION: ${DB_BACKUP_RETENTION:-20}
      DB_BACKUP_MAX_AGE_HOURS: ${DB_BACKUP_MAX_AGE_HOURS:-48}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://uliuli.cn}
      WINDCHIME_HASH_SALT: ${WINDCHIME_HASH_SALT:?set WINDCHIME_HASH_SALT in .env}
      MAIL_BLOCKED_TERMS: ${MAIL_BLOCKED_TERMS:-}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      BILIBILI_API_URL: ${BILIBILI_API_URL:-https://1377297588-5v9c60xnw1.ap-guangzhou.tencentscf.com/?mid=3546779356235807}
      BILIBILI_CACHE_TTL_SECONDS: ${BILIBILI_CACHE_TTL_SECONDS:-180}
      BILIBILI_FETCH_TIMEOUT_MS: ${BILIBILI_FETCH_TIMEOUT_MS:-8000}
      BILIBILI_REFRESH_ERROR_BACKOFF_SECONDS: ${BILIBILI_REFRESH_ERROR_BACKOFF_SECONDS:-60}
    volumes:
      - ./data:/app/data
      - ./public/memes:/app/public/memes
      - ./public/pic:/app/public/pic
