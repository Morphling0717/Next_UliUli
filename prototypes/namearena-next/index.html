<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080b0e" />
    <title>名字大乱斗：竞技场 UI 原型</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <canvas id="fx-canvas" aria-hidden="true"></canvas>

    <main class="game-shell" id="game-shell">
      <header class="broadcast-bar">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true">名</span>
          <div>
            <strong>名字大乱斗</strong>
            <span>NAMEWAR // CHAOS BROADCAST</span>
          </div>
        </div>

        <div class="match-state" aria-label="比赛状态">
          <span class="live-dot"></span>
          <b>全局 <span id="global-turn">37</span></b>
          <i></i>
          <b>大回合 <span id="major-round">3</span></b>
          <i></i>
          <b><span id="alive-count">8</span> 存活</b>
        </div>

        <div class="broadcast-controls">
          <div class="speed-control" aria-label="演示速度">
            <button type="button" data-speed="1" class="is-active">x1</button>
            <button type="button" data-speed="1.5">x1.5</button>
            <button type="button" data-speed="2">x2</button>
          </div>
          <button class="icon-button" id="pause-button" type="button" title="暂停演示" aria-label="暂停演示">Ⅱ</button>
          <button class="icon-button" id="restart-button" type="button" title="重新播放" aria-label="重新播放">↻</button>
          <button class="icon-button" id="sound-button" type="button" title="开启音效" aria-label="开启音效">♪</button>
          <button class="icon-button" id="fullscreen-button" type="button" title="全屏" aria-label="全屏">⛶</button>
        </div>
      </header>

      <section class="battle-layout">
        <section class="arena" id="arena" aria-label="战斗舞台">
          <div class="arena-backdrop" aria-hidden="true"></div>
          <div class="arena-grid" aria-hidden="true"></div>
          <div class="arena-vignette" aria-hidden="true"></div>

          <div class="event-banner" id="event-banner">
            <span id="event-kicker">ACTION 037</span>
            <strong id="event-title">战场态势同步中</strong>
            <small id="event-subtitle">等待下一次行动</small>
          </div>

          <div class="round-orbit" aria-hidden="true">
            <span>ROUND</span>
            <b id="orbit-round">03</b>
          </div>

          <div class="fighters" id="fighters"></div>
          <div class="summon-slot" id="summon-slot" aria-live="polite"></div>
          <div class="damage-layer" id="damage-layer" aria-hidden="true"></div>

          <div class="selected-dossier" id="selected-dossier" aria-live="polite"></div>

          <div class="arena-footer">
            <div class="threat-meter">
              <span>战场烈度</span>
              <div><i id="threat-fill"></i></div>
              <b id="threat-label">交战</b>
            </div>
            <div class="next-actor">
              <span>下一行动</span>
              <b id="next-actor">小汀</b>
              <i id="next-countdown">2.8s</i>
            </div>
          </div>
        </section>

        <aside class="combat-feed" aria-label="战斗记录">
          <div class="feed-header">
            <div>
              <span>COMBAT FEED</span>
              <strong>实时战斗记录</strong>
            </div>
            <button type="button" id="feed-toggle" title="展开或收起战斗记录" aria-label="展开或收起战斗记录">▤</button>
          </div>
          <div class="initiative-strip" id="initiative-strip" aria-label="行动顺序"></div>
          <div class="feed-list" id="feed-list" aria-live="polite"></div>
          <div class="feed-footer">
            <span><i class="legend skill"></i>技能</span>
            <span><i class="legend damage"></i>伤害</span>
            <span><i class="legend system"></i>系统</span>
            <span class="sync-state">● 同步</span>
          </div>
        </aside>
      </section>

      <nav class="mobile-tabs" aria-label="手机视图切换">
        <button type="button" class="is-active" data-mobile-view="arena">战场</button>
        <button type="button" data-mobile-view="feed">战报</button>
      </nav>
    </main>

    <section class="cinematic" id="cinematic" aria-hidden="true">
      <div class="cinematic-scan"></div>
      <div class="cinematic-art" id="cinematic-art"></div>
      <div class="cinematic-copy">
        <span id="cinematic-kicker">PHASE SHIFT</span>
        <h1 id="cinematic-title">角色名</h1>
        <p id="cinematic-subtitle">形态名称</p>
      </div>
      <div class="cinematic-line"></div>
    </section>

    <div class="impact-flash" id="impact-flash" aria-hidden="true"></div>
    <div class="rotate-hint" aria-hidden="true">
      <span>↻</span>
      <strong>横屏获得完整战场视野</strong>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
